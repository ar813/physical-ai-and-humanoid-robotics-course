<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#gradient1)" />
  
  <!-- Robot head -->
  <rect x="30" y="25" width="40" height="35" rx="4" fill="white" opacity="0.95" />
  
  <!-- Eyes -->
  <circle cx="38" cy="38" r="4" fill="#667eea" />
  <circle cx="62" cy="38" r="4" fill="#667eea" />
  
  <!-- Antenna -->
  <line x1="50" y1="25" x2="50" y2="15" stroke="white" stroke-width="2" stroke-linecap="round" />
  <circle cx="50" cy="15" r="3" fill="#764ba2" />
  
  <!-- Mouth/Speaker -->
  <rect x="38" y="48" width="24" height="8" rx="4" fill="#667eea" opacity="0.7" />
  <line x1="40" y1="52" x2="44" y2="52" stroke="white" stroke-width="1.5" />
  <line x1="46" y1="52" x2="50" y2="52" stroke="white" stroke-width="1.5" />
  <line x1="52" y1="52" x2="56" y2="52" stroke="white" stroke-width="1.5" />
  <line x1="58" y1="52" x2="58" y2="52" stroke="white" stroke-width="1.5" />
  
  <!-- Body -->
  <rect x="35" y="62" width="30" height="20" rx="3" fill="white" opacity="0.95" />
  
  <!-- AI circuits -->
  <path d="M 42 68 L 46 72 L 42 76" stroke="#764ba2" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 58 68 L 54 72 L 58 76" stroke="#764ba2" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="50" cy="72" r="2" fill="#667eea" />
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>